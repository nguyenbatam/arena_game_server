apiVersion: v1
kind: Secret
metadata:
  name: arena-admin
  namespace: arena
type: Opaque
stringData:
  ADMIN_TOKEN: change-me-in-production
  JWT_SECRET: change-me-jwt-secret-min-32-chars!!
  REDIS_PASSWORD: change-me-redis-password
  # The platform tier's database. Empty leaves the tier off and the realtime
  # tier running on its own, which is the safe default for a manifest that is
  # applied before anybody has provisioned a database.
  #
  # It is a Secret and not a ConfigMap entry because the DSN carries the
  # password. Point it at a managed instance:
  #
  #   PLATFORM_DSN: "postgres://arena:...@db.example.internal:5432/arena?sslmode=require"
  #
  # There is deliberately no postgres.yaml next to redis.yaml. Redis here is a
  # cache — every key in it has a TTL and can be rebuilt from play, so a
  # single-replica StatefulSet with a 1Gi volume is an honest way to run it. An
  # account store is the opposite: it cannot be rebuilt from anything, and a
  # single-replica StatefulSet with no backups, no failover and no
  # point-in-time recovery is not a way to run one. That is a managed database,
  # and the only thing this repo should have an opinion about is the DSN.
  PLATFORM_DSN: ""
