name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: --config=../.golangci.yml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "these files are not gofmt'd:"
            echo "$out"
            exit 1
          fi
      - name: vet
        working-directory: backend
        run: go vet ./...
      # -shuffle=on because the order dependency it catches is invisible
      # otherwise: a test that reads a package-level Prometheus collector, or
      # any other shared state, passes on its own and fails only when something
      # else in the package ran first. One was added and caught exactly this
      # way; the flag is what stops the next one reaching main.
      - name: test
        working-directory: backend
        run: go test -count=1 -shuffle=on ./...
      - name: race
        working-directory: backend
        run: go test -race -count=1 -shuffle=on ./...

  # govulncheck reads the call graph, not just go.mod, so it reports the
  # vulnerabilities this code can actually reach rather than every advisory
  # touching a module in the tree. It is a separate job from lint because it
  # fails for a reason nobody edited: an advisory published against a dependency
  # that has not changed. A red build on a morning when nothing was pushed is
  # the signal, not noise.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: govulncheck
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The platform tier's conformance suite runs one set of assertions against both
  # of its Store implementations. The `test` job above covers the memory half and
  # skips the Postgres half, because a Go toolchain is not a database — so this
  # job is the Postgres half, and without it that skip would be a hole rather
  # than a convenience. Same reasoning as miniredis for the Redis stores; there
  # is simply no in-process Postgres to do it with.
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: platform store conformance (memory + postgres)
        working-directory: backend
        env:
          PLATFORM_TEST_DSN: postgres://arena:arena@localhost:5432/arena?sslmode=disable
        run: go test -race -count=1 ./internal/platform/...
      # The gateway against a real database: the Postgres branch of
      # startPlatform, the pool, the schema migration and the rating-store swap
      # are only exercised with the DSN set.
      - name: gateway against postgres
        working-directory: backend
        env:
          PLATFORM_TEST_DSN: postgres://arena:arena@localhost:5432/arena?sslmode=disable
        run: go test -race -count=1 -run TestTheGatewayComesUpAgainstARealDatabase ./internal/app/

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-protoc@v3
        with:
          # Must match the protoc that generated the committed
          # backend/gen/pb/arena.pb.go — the version goes in a header comment of
          # the generated file, so a different one here fails the drift check
          # below on nothing but that line. 33.2 is what the checked-in file and
          # scripts/run_local_test.sh's local drift check were produced with;
          # bumping it means regenerating and committing in the same change.
          version: "33.2"
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gen + drift check
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          export PATH="$(go env GOPATH)/bin:$PATH"
          sh scripts/gen-proto.sh
          git diff --exit-code backend/gen/pb
